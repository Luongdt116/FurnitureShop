services:
  app:
    build:
      context: .
      dockerfile: dockerfile
    container_name: furniture_app
    working_dir: /var/www
    env_file:
      - .env
    environment:
      APP_URL: http://localhost:8000
      APP_TIMEZONE: Asia/Ho_Chi_Minh
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: furniture
      DB_USERNAME: furniture
      DB_PASSWORD: secret
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    volumes:
      - ./:/var/www
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >-
      sh -c "php artisan migrate --force
      && php artisan db:seed --class=DemoAccountsSeeder --force
      && php artisan db:seed --class=DemoCatalogSeeder --force
      && php artisan serve --host=0.0.0.0 --port=8000"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8000) ? 0 : 1);"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: dockerfile
    container_name: furniture_scheduler
    working_dir: /var/www
    env_file:
      - .env
    environment:
      APP_URL: http://localhost:8000
      APP_TIMEZONE: Asia/Ho_Chi_Minh
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: furniture
      DB_USERNAME: furniture
      DB_PASSWORD: secret
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    volumes:
      - ./:/var/www
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    command: php artisan schedule:work
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: furniture_db
    environment:
      MYSQL_DATABASE: furniture
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: furniture
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: furniture_phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: furniture
      PMA_PASSWORD: secret
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dbdata:
